<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B5D3B">
<title>দোকান হিসাব</title>
<style>
:root{--g:#0B5D3B;--g2:#07412A;--gold:#B8923F;--bg:#F3EDDA;--card:#FBF8EE;--ink:#17261E;--mut:#5E6B63;--line:#D9D0B5;--bad:#9B2C2C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Bengali","Hind Siliguri","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{position:sticky;top:0;z-index:5;background:var(--g);color:#F6F1E3;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:3px solid var(--gold)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{margin:0;font-size:19px;line-height:1.2;font-weight:700}
.brand p{margin:0;font-size:12.5px;opacity:.85}
.lang{min-height:40px;min-width:56px;border:1.5px solid rgba(246,241,227,.6);background:transparent;color:#F6F1E3;border-radius:10px;font-weight:700;padding:0 12px}
main{max-width:560px;margin:0 auto;padding:12px 14px}
.bar{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.bar .mid{flex:1;text-align:center;position:relative;min-height:48px;display:flex;flex-direction:column;justify-content:center}
.dmain{font-weight:700;font-size:18px;line-height:1.2}
.dsub{font-size:13px;color:var(--mut)}
.mid input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0}
.ib{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--g);display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.ib.sm{width:38px;height:38px;border:0;background:transparent;color:var(--bad)}
.ib.ed{color:var(--g)}
.ticket{background:var(--g);color:#F6F1E3;border-radius:16px;padding:14px 16px;margin:0 0 12px;position:relative}
.ticket .tl{font-size:14px;opacity:.9}
.ticket .tbig{font-size:30px;font-weight:700;line-height:1.25}
.perf{border-top:2px dashed rgba(246,241,227,.4);margin:12px -16px;position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.perf::before{left:-9px}.perf::after{right:-9px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:3px 0}
.trow.big b{font-size:20px}
.sin{width:48%;background:transparent;border:0;border-bottom:1.5px solid rgba(246,241,227,.6);color:#F6F1E3;text-align:right;font-weight:700;font-size:20px;min-height:42px;padding:0 2px;border-radius:0}
.sin::placeholder{color:rgba(246,241,227,.5)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:0 0 12px}
.seg button{min-height:48px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;font-size:13.5px;line-height:1.25;padding:4px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--g);color:#F6F1E3;border-color:var(--g)}
.slip{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 12px;overflow:hidden}
.slip .sh{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#EFE7CF;border-bottom:1px solid var(--line);font-weight:700}
.ln{display:flex;align-items:baseline;gap:6px;padding:4px 4px 4px 12px;border-bottom:1px solid #E7DFC6;min-height:46px}
.ln:last-child{border-bottom:0}
.ln .ld{word-break:break-word;align-self:center}
.ln .dots{flex:1;border-bottom:2px dotted #BDB391;min-width:14px;transform:translateY(-5px)}
.ln .la{font-weight:700;white-space:nowrap;align-self:center}
.empty{padding:18px 14px;color:var(--mut);text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card h2{margin:0 0 8px;font-size:17px}
.fl{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
.in{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff}
.in:focus{border-color:var(--g)}
.btn{min-height:48px;border:0;border-radius:12px;background:var(--g);color:#fff;font-weight:700;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.wide{width:100%;margin-top:14px}
.btn.ghost{background:transparent;color:var(--g);border:1.5px solid var(--g)}
.row2{display:flex;gap:8px;margin-top:14px}
.row2 .btn{flex:1}
.pill{display:inline-block;font-size:12.5px;padding:1px 10px;border-radius:99px;border:1px solid var(--gold);color:#7A5B1C;background:#F6EBCB;margin-left:6px;vertical-align:middle}
.sc .hd{display:flex;align-items:center;justify-content:space-between;gap:4px}
.sc .nm{font-weight:700;font-size:17px}
.sc .sub{color:var(--mut);font-size:14px;margin:0 0 6px}
.kv{display:flex;align-items:baseline;gap:6px;padding:2px 0}
.kv i{flex:1;border-bottom:2px dotted #BDB391;transform:translateY(-4px)}
.kv.strong{font-weight:700;font-size:17px;color:var(--g);margin-top:4px;padding-top:6px;border-top:1px solid var(--line)}
.neg{color:var(--bad)}
.note{color:var(--mut);margin:6px 0 0;font-size:14px}
.hint{color:var(--mut);font-size:14px;margin:6px 0 0}
.chk{display:flex;align-items:center;gap:12px;min-height:46px}
.chk input{width:22px;height:22px;accent-color:var(--g)}
textarea.in{min-height:96px;resize:vertical}
.pg{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.pg h2{margin:0;font-size:20px}
nav.nv{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.nv button{border:0;background:transparent;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;padding:0 2px;color:var(--mut);border-top:3px solid transparent}
nav.nv button.on{color:var(--g);border-top-color:var(--gold);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--g2);color:#F6F1E3;padding:10px 16px;border-radius:10px;font-size:14.5px;z-index:40;max-width:90%;text-align:center;display:none}
.row2 .in{flex:1;min-width:0}
.slip .subh{display:flex;justify-content:space-between;padding:6px 12px;background:#F5EFD9;font-weight:700;font-size:14px;color:var(--g);border-bottom:1px solid #E7DFC6}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wh{text-align:center;font-size:12px;color:var(--mut)}
.dc{min-height:62px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:3px 1px;display:flex;flex-direction:column;align-items:center;font-size:10.5px;line-height:1.3;overflow:hidden;color:var(--ink)}
.dc b{font-size:14px}
.dc .cs{color:var(--g);font-weight:700}
.dc .ce{color:var(--mut)}
.dc.empty{background:transparent;border-style:dashed;color:var(--mut)}
.dc.today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.modal{position:fixed;inset:0;background:rgba(7,65,42,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.mbox{background:var(--bg);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.mbox img{width:100%;border:1px solid var(--line);border-radius:10px;display:block}
#printbox{display:none}
@media print{body>#app,body>#toast{display:none!important}body{padding:0;background:#fff}#printbox{display:block!important}#printbox img{width:100%;display:block}}
@media (prefers-color-scheme:dark){:root{color-scheme:light}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function p2(n){return n<10?'0'+n:''+n;}
function fmtDate(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function todayISO(){return fmtDate(new Date());}
function parseDate(iso){var a=iso.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function addDays(iso,n){var d=parseDate(iso);d.setDate(d.getDate()+n);return fmtDate(d);}
function addMonths(ym,n){var a=ym.split('-').map(Number);var d=new Date(a[0],a[1]-1+n,1);return d.getFullYear()+'-'+p2(d.getMonth()+1);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function t(k){return (T[S.lang]&&T[S.lang][k])||k;}
function dg(s){return S.lang==='bn'?String(s).replace(/\d/g,function(d){return BN[d];}):String(s);}
function money(n){n=Math.round(n||0);var neg=n<0;var s=Math.abs(n).toLocaleString('en-IN');return (neg?'-':'')+'৳'+dg(s);}
function toEn(s){return String(s==null?'':s).replace(/[০-৯]/g,function(c){return BN.indexOf(c);}).replace(/,/g,'').trim();}
function toNum(s){var v=parseFloat(toEn(s));return isFinite(v)?v:NaN;}
function toShare(s){var e=toEn(s);var m=e.match(/^(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)$/);if(m){var d=parseFloat(m[2]);return d>0?parseFloat(m[1])/d:NaN;}return toNum(e);}

function dayOf(iso){return S.days[iso]||{sales:0,cash:null,entries:[]};}
function ensureDay(iso){if(!S.days[iso])S.days[iso]={sales:0,cash:null,entries:[]};return S.days[iso];}
// Sales = cash left in the drawer at close + all cash paid out that day (no opening cash).
function salesOf(dd){var out=dd.entries.reduce(function(a,e){return a+e.amount;},0);return (dd.cash!=null)?(dd.cash+out):(dd.sales||0);}
function sumE(list){return list.reduce(function(a,e){return a+e.amount;},0);}

function monthData(ym){
 var a=ym.split('-').map(Number);var D=new Date(a[0],a[1],0).getDate();
 var sales=0,pay=0,bazar=0,shop=0,adv={},advL={},paid={},paidL={},pw={},pwL={};
 for(var k in S.days){
  if(k.slice(0,7)!==ym)continue;
  var dd=S.days[k];sales+=salesOf(dd);
  dd.entries.forEach(function(e){
   if(e.type==='pay')pay+=e.amount;
   else if(e.type==='bazar')bazar+=e.amount;
   else if(e.type==='shop')shop+=e.amount;
   else if(e.type==='pwd'){pw[e.partnerId]=(pw[e.partnerId]||0)+e.amount;(pwL[e.partnerId]=pwL[e.partnerId]||[]).push({day:k,amount:e.amount,desc:e.desc||''});}
   else if(e.type==='sal'){paid[e.staffId]=(paid[e.staffId]||0)+e.amount;(paidL[e.staffId]=paidL[e.staffId]||[]).push({day:k,amount:e.amount,desc:e.desc||''});}
   else if(e.type==='adv'){adv[e.staffId]=(adv[e.staffId]||0)+e.amount;(advL[e.staffId]=advL[e.staffId]||[]).push({day:k,amount:e.amount,desc:e.desc||''});}
  });
 }
 var first=ym+'-01',last=ym+'-'+p2(D);
 var rows=S.staff.map(function(s){
  var j=s.join||'0000-01-01';var days=D;
  if(j>last)days=0;else if(j>first)days=D-Number(j.slice(8,10))+1;
  var gross=Math.round(s.salary*days/D);var ad=adv[s.id]||0;var pd=paid[s.id]||0;
  return {s:s,days:days,D:D,gross:gross,adv:ad,net:gross-ad,paid:pd,due:gross-ad-pd,pays:(paidL[s.id]||[]).slice().sort(function(a,b){return a.day<b.day?-1:1;}),advs:(advL[s.id]||[]).slice().sort(function(a,b){return a.day<b.day?-1:1;})};
 });
 var staffCost=0,mgrCost=0;
 rows.forEach(function(r){if(r.s.role==='manager')mgrCost+=r.gross;else staffCost+=r.gross;});
 var costs=pay+shop+(S.bazarInProfit?bazar:0)+staffCost+mgrCost;
 var profit=sales-costs;
 var totalShare=S.partners.reduce(function(x,p){return x+p.share;},0);
 var parts=S.partners.map(function(p){var amt=totalShare>0?profit*p.share/totalShare:0,tk=pw[p.id]||0;return {p:p,amt:amt,taken:tk,left:amt-tk,list:(pwL[p.id]||[]).slice().sort(function(a,b){return a.day<b.day?-1:1;})};});
 return {D:D,sales:sales,pay:pay,bazar:bazar,shop:shop,rows:rows,staffCost:staffCost,mgrCost:mgrCost,costs:costs,profit:profit,totalShare:totalShare,parts:parts};
}

function rfit(x,txt,maxW){

function paintReceipt(x,H){
 var dd=dayOf(ui.date),dt=parseDate(ui.date),R=RW-RP,y=0;
 var groups=[];
 KINDS.forEach(function(k){var l=dd.entries.filter(function(e){return e.type===k;});if(l.length)groups.push({k:k,l:l});});
 var out=sumE(dd.entries),cashIn=dd.cash!=null?dd.cash:Math.max(0,salesOf(dd)-out),tot=salesOf(dd);
 x.fillStyle='#FBF8EE';x.fillRect(0,0,RW,H||5000);
 x.fillStyle='#0B5D3B';x.fillRect(0,0,RW,132);
 x.fillStyle='#B8923F';x.fillRect(0,132,RW,5);
 x.textAlign='left';x.fillStyle='#F6F1E3';
 x.font='700 34px '+RF;x.fillText(rfit(x,S.shopName||t('app'),RW-2*RP),RP,58);
 x.font='500 22px '+RF;x.fillText(rfit(x,t('rc_title')+' - '+dlabel(ui.date)+', '+WD[S.lang][dt.getDay()],RW-2*RP),RP,100);
 y=184;
 function row(label,amt,font,color,lh){
  x.font=font;x.fillStyle=color;x.textAlign='left';
  var a=money(amt),aw=x.measureText(a).width;
  var lab=rfit(x,label,R-RP-aw-40),lw=x.measureText(lab).width;
  x.fillText(lab,RP,y);

  y+=lh;
 }
 if(!groups.length){x.font='500 22px '+RF;x.fillStyle='#5E6B63';x.fillText(t('rc_none'),RP,y);y+=50;}
 groups.forEach(function(g){
  x.fillStyle='#EFE7CF';x.fillRect(0,y-32,RW,46);
  x.fillStyle='#0B5D3B';x.font='700 24px '+RF;x.textAlign='left';x.fillText(t(g.k),RP,y);

  y+=42;
  g.l.forEach(function(e){row(entryText(e),e.amount,'500 22px '+RF,'#17261E',42);});
  y+=14;
 });
 x.strokeStyle='#0B5D3B';x.lineWidth=2;x.setLineDash([10,8]);
 x.beginPath();x.moveTo(0,y-14);x.lineTo(RW,y-14);x.stroke();x.setLineDash([]);
 y+=30;
 row(t('out'),out,'600 24px '+RF,'#17261E',46);
 row(t('cash_in'),cashIn,'600 24px '+RF,'#17261E',52);
 row(t('sales_tot'),tot,'700 32px '+RF,'#0B5D3B',40);
 x.font='500 18px '+RF;x.fillStyle='#5E6B63';x.textAlign='center';
 x.fillText(t('formula'),RW/2,y+4);
 x.fillText(t('app'),RW/2,y+40);x.textAlign='left';
 return y+66;
}

var KINDS=['pay','bazar','shop','adv','sal','pwd'];

function lev(a,b){
 var m=a.length,n=b.length,d=[],i,j;
 for(i=0;i<=m;i++){d[i]=[i];}
 for(j=1;j<=n;j++)d[0][j]=j;
 for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
 return d[m][n];
}
function matchIn(list,name,fuzzy){
 var n=String(name||'').trim().toLowerCase();if(!n)return '';
 var i,sn;
 for(i=0;i<list.length;i++){sn=list[i].name.trim().toLowerCase();if(sn&&(n===sn||n.indexOf(sn)===0))return list[i].id;}
 if(fuzzy&&n.length>=3){
  var best='',bd=99;
  list.forEach(function(x){var q=x.name.trim().toLowerCase();if(q.length<3)return;var dd=lev(n,q),lim=q.length>=6?2:1;if(dd<=lim&&dd<bd){bd=dd;best=x.id;}});
  return best;
 }
 return '';
}
function matchStaff(name,fuzzy){return matchIn(S.staff,name,fuzzy);}
function matchPartner(name,fuzzy){return matchIn(S.partners,name,fuzzy);}
function shrinkImage(file){
 return new Promise(function(res,rej){
  var u=URL.createObjectURL(file),im=new Image();
  im.onload=function(){
   var M=1280,sc=Math.min(1,M/Math.max(im.width,im.height));
   var c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
   c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
   var url=c.toDataURL('image/jpeg',0.8);res({url:url,b64:url.split(',')[1]});
  };
  im.onerror=function(){rej(new Error('image'));};
  im.src=u;
 });
}
async function callGemini(b64){
 var names=S.staff.map(function(x){return x.name;}).join(', '),pnames=S.partners.map(function(x){return x.name;}).join(', ');
 var prompt='This is a photo of a handwritten daily expense slip from a shop in Bangladesh. Text may be Bangla or English; digits may be Bangla or English. '
  +'Return JSON only, in this exact shape: {"date":"YYYY-MM-DD or null","items":[{"section":"pay|bazar|shop","description":"short text as written","amount":number,"staff":"staff name or null","staff_kind":"salary|advance|null"}]}. '
  +'Section headings: বাজার = bazar, দোকান = shop, পেমেন্ট = pay. Each handwritten line under a heading becomes one item. '
  +'If a line is a person\'s name with an amount (money taken by a staff member), put that name in "staff" (a staff member or a shareholder) and leave description empty. '
  +'Set "staff_kind" to "salary" only if the line says বেতন or salary, "advance" only if it says অগ্রিম, advance or adv, otherwise null. '
  +'Known staff names: '+(names||'none')+'. Known shareholder names: '+(pnames||'none')+'. Amounts are in taka; ignore "/-", "=" and dashes. A date like 04.10.26 means day.month.year, so 2026-10-04. '
  +'Give your best reading of unclear words and never invent lines that are not on the slip.';
 var r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(S.geminiModel||'gemini-3.5-flash-lite')+':generateContent',{
  method:'POST',
  headers:{'Content-Type':'application/json','x-goog-api-key':S.geminiKey},
  body:JSON.stringify({contents:[{parts:[{text:prompt},{inlineData:{mimeType:'image/jpeg',data:b64}}]}],generationConfig:{responseMimeType:'application/json'}})
 });
 var data={};try{data=await r.json();}catch(e){}
 if(!r.ok)throw new Error((data.error&&data.error.message)||('HTTP '+r.status));
 var parts=(data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts)||[];
 var txt=parts.map(function(p){return p.text||'';}).join('').replace(/```json|```/g,'').trim();
 var o=JSON.parse(txt);
 var date=(typeof o.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(o.date)&&!isNaN(parseDate(o.date).getTime()))?o.date:null;
 var ym=(date||ui.date).slice(0,7),mrows=null;
 var items=(Array.isArray(o.items)?o.items:[]).map(function(it){
  var amt=toNum(it.amount),kind=KINDS.indexOf(it.section)>=0&&!isStaffKind(it.section)?it.section:'shop';
  var desc=String(it.description||'').trim(),who=String(it.staff||'').trim(),guess=false;
  var sid=matchStaff(who,true)||matchStaff(desc),pid=sid?'':(matchPartner(who,true)||matchPartner(desc));
  if(pid){desc='';kind='pwd';}
  else if(sid){
   desc='';var hint=String(it.staff_kind||'').toLowerCase();
   if(hint==='salary')kind='sal';
   else if(hint==='advance')kind='adv';
   else{
    guess=true;kind='adv';
    if(!mrows)mrows=monthData(ym).rows;
    var row=mrows.filter(function(r){return r.s.id===sid;})[0];
    if(row&&row.due>0&&isFinite(amt)&&amt>=row.due)kind='sal';
   }
  }
  return {kind:kind,desc:desc,amount:(isFinite(amt)&&amt>0)?amt:'',staffId:sid,partnerId:pid,guess:guess};
 });
 return {items:items,date:date};
}

}
function saveStaff(){
 var name=val('s-name').trim();var sal=toNum(val('s-salary'));
 if(!name){toast(t('e_name'));return;}
 if(!(sal>=0)){toast(t('e_amt'));return;}
 var o={name:name,role:val('s-role')==='manager'?'manager':'staff',salary:sal,join:val('s-join')||''};
 if(ui.sform.id){S.staff.forEach(function(s){if(s.id===ui.sform.id){s.name=o.name;s.role=o.role;s.salary=o.salary;s.join=o.join;}});}
 else{o.id=uid();S.staff.push(o);}
 ui.sform=null;save();render();toast(t('saved'));
}
function addPartner(){
 var name=val('p-name').trim();var sh=toShare(val('p-share'));
 if(!name){toast(t('e_name'));return;}
 if(!(sh>0)){toast(t('e_share'));return;}
 S.partners.push({id:uid(),name:name,share:sh});save();render();toast(t('added'));
}
function copyText(txt){
 function fallback(){var ta=$('#bk');ta.focus();ta.select();try{document.execCommand('copy');toast(t('copied'));}catch(e){}}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast(t('copied'));},fallback);}else fallback();
}

document.addEventListener('click',function(ev){
 var tb=ev.target.closest('[data-tab]');
 if(tb){ui.tab=tb.getAttribute('data-tab');ui.sform=null;render();window.scrollTo(0,0);return;}
 var sb=ev.target.closest('[data-sec]');
 if(sb){ui.sec=sb.getAttribute('data-sec');render();return;}
 var b=ev.target.closest('[data-act]');if(!b)return;
 var a=b.getAttribute('data-act');var id=b.getAttribute('data-id');
 if(a==='lang'){S.lang=S.lang==='bn'?'en':'bn';save();render();}
 else if(a==='dprev'){ui.date=addDays(ui.date,-1);render();}
 else if(a==='dnext'){ui.date=addDays(ui.date,1);render();}
 else if(a==='mprev'){ui.month=addMonths(ui.month,-1);render();}
 else if(a==='mnext'){ui.month=addMonths(ui.month,1);render();}
 else if(a==='add')addEntry();
 else if(a==='scan'||a==='scangal'){if(!S.geminiKey){toast(t('e_key'),3500);ui.tab='set';render();window.scrollTo(0,0);}else{var fi=document.getElementById(a==='scan'?'slip-cam':'slip-gal');if(fi)fi.click();}}
 else if(a==='scclose'){ui.scan=null;render();}
 else if(a==='scdel'){if(ui.scan){ui.scan.items.splice(+id,1);render();}}
 else if(a==='scadd'){if(ui.scan){ui.scan.items.push({kind:'shop',desc:'',amount:'',staffId:''});render();}}
 else if(a==='scok')confirmScan();
 else if(a==='goday'){ui.date=id;ui.sec='all';ui.tab='day';render();window.scrollTo(0,0);}
 else if(a==='receipt'){ui.rcptUrl=buildReceipt();render();}
 else if(a==='rclose'){ui.rcptUrl=null;render();}
 else if(a==='rshare')shareReceipt();
 else if(a==='rprint')window.print();
 else if(a==='rdl')downloadReceipt();
 else if(a==='del'){if(confirm(t('del_q'))){var dd=ensureDay(ui.date);dd.entries=dd.entries.filter(function(e){return e.id!==id;});save();render();toast(t('removed'));}}
 else if(a==='snew'){ui.sform={id:null};render();}
 else if(a==='sedit'){ui.sform={id:id};render();window.scrollTo(0,0);}
 else if(a==='scancel'){ui.sform=null;render();}
 else if(a==='ssave')saveStaff();
 else if(a==='sdel'){if(confirm(t('del_staff_q'))){S.staff=S.staff.filter(function(s){return s.id!==id;});save();render();toast(t('removed'));}}
 else if(a==='padd')addPartner();
 else if(a==='pdel'){S.partners=S.partners.filter(function(p){return p.id!==id;});save();render();}
 else if(a==='bkmake'){$('#bk').value=backupText();}
 else if(a==='bkcopy'){var ta=$('#bk');if(!ta.value)ta.value=backupText();copyText(ta.value);}
 else if(a==='bkrestore'){
  try{
   var o=JSON.parse(val('bk'));
   if(!o||!Array.isArray(o.staff)||!Array.isArray(o.partners)||typeof o.days!=='object')throw new Error('bad');
   var n=JSON.parse(JSON.stringify(DEF));for(var k in o)n[k]=o[k];
   n.geminiKey=S.geminiKey||'';S=n;save();render();toast(t('bk_ok'));
  }catch(e){toast(t('bk_bad'));}
 }
});
document.addEventListener('change',function(ev){
 var e=ev.target;
 if(e.id==='cash'){
  var v=toNum(e.value);var dd=ensureDay(ui.date);dd.cash=(v>=0)?v:null;save();
  e.value=dd.cash!=null?dg(dd.cash):'';
  $('#t-sales').textContent=money(salesOf(dd));
 }else if(e.id==='dpick'){
  if(/^\d{4}-\d{2}-\d{2}$/.test(e.value)){ui.date=e.value;render();}
 }else if(e.id==='slip-cam'||e.id==='slip-gal'){
  var f=e.files&&e.files[0];e.value='';if(f)processSlip(f);
 }else if(e.id==='sc-date'){
  if(ui.scan&&/^\d{4}-\d{2}-\d{2}$/.test(e.value))ui.scan.date=e.value;
 }else if(/^sc-[kadsp]-\d+$/.test(e.id)&&ui.scan){
  var m=e.id.match(/^sc-([kadsp])-(\d+)$/),it=ui.scan.items[+m[2]];
  if(it){
   if(m[1]==='a'){var v=toNum(e.value);it.amount=v>0?v:'';e.value=it.amount===''?'':dg(it.amount);}
   else if(m[1]==='d')it.desc=e.value;
   else if(m[1]==='s')it.staffId=e.value;
   else if(m[1]==='p')it.partnerId=e.value;
   else{it.kind=e.value;it.guess=false;if(isStaffKind(it.kind)&&!it.staffId&&S.staff.length)it.staffId=S.staff[0].id;if(it.kind==='pwd'&&!it.partnerId&&S.partners.length)it.partnerId=S.partners[0].id;render();}
  }
 }else if(e.id==='f-kind'){
  ui.fkind=e.value;ui.draft={desc:val('f-desc'),amt:val('f-amt')};render();
 }else if(e.id==='gem-key'){
  S.geminiKey=e.value.trim();save();
 }else if(e.id==='gem-model'){
  S.geminiModel=e.value.trim()||'gemini-3.5-flash-lite';save();
 }else if(e.id==='shop-name'){
  S.shopName=e.value.trim();save();
 }else if(e.id==='opt-bz'){
  S.bazarInProfit=e.checked;save();
 }
});
render();
})();
</script>
</body>
</html>
